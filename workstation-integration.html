<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>公众号排版助手 · 多 Tab 工作站</title>
<style>/* ============================================================
   外壳样式（仅外壳层；工作台 iframe 是纸面色卡设计，不随主题变化）
   颜色一律走语义令牌 --c-*：改主题只动令牌定义，不碰具体规则
   ============================================================ */

/* ---- 语义令牌 · 暗色（默认） ---- */
:root {
  color-scheme: dark light;
  --c-bg: #0e0e10;        /* 页面底色 */
  --c-surface: #161618;   /* 工作站面板 */
  --c-elev: #262629;      /* 抬升面：激活 Tab / code 底 */
  --c-border: #2a2a2e;    /* 分隔线 */
  --c-text: #e8e8ea;      /* 主文字 */
  --c-text-strong: #fff;  /* 强调文字（激活 Tab） */
  --c-dim: #9a9aa0;       /* 次级文字 */
  --c-faint: #6a6a70;     /* 弱化文字 */
  --c-accent: #C9A962;    /* 金色强调 */
  --c-accent-deep: #8f7434; /* 浅色底上的金色（深一档保对比度） */
  /* 纸面（工作台容器/loading，不随主题变） */
  --paper: #f5f2ea;
}

/* ---- 语义令牌 · 浅色（手动 data-theme="light"，或系统浅色且未手动指定） ---- */
:root[data-theme="light"] {
  color-scheme: light;
  --c-bg: #f2f2f4;
  --c-surface: #ffffff;
  --c-elev: #e9e9ec;
  --c-border: #dcdce1;
  --c-text: #1e1e20;
  --c-text-strong: #000;
  --c-dim: #63636b;
  --c-faint: #9c9ca4;
  --c-accent: #8f7434;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]):not([data-theme="light"]) {
    color-scheme: light;
    --c-bg: #f2f2f4;
    --c-surface: #ffffff;
    --c-elev: #e9e9ec;
    --c-border: #dcdce1;
    --c-text: #1e1e20;
    --c-text-strong: #000;
    --c-dim: #63636b;
    --c-faint: #9c9ca4;
    --c-accent: #8f7434;
  }
}

/* ---- 基础 ---- */
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}body{font-family:"Noto Sans SC",-apple-system,"PingFang SC",sans-serif;background:var(--c-bg);color:var(--c-text);height:100vh;height:100dvh;overflow:hidden}.workstation{width:100%;height:100%;background:var(--c-surface);display:flex;flex-direction:column;overflow:hidden}

/* ---- 顶栏 ---- */
.topbar{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:1px solid var(--c-border);flex-wrap:wrap}.topbar .logo{font-size:17px;font-weight:700;letter-spacing:1px}.topbar .logo small{font-size:11px;color:var(--c-dim);font-weight:400;margin-left:8px}.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex-shrink:0;background:transparent;border:none;color:var(--c-dim);padding:9px 18px;font-size:14px;border-radius:8px 8px 0 0;cursor:pointer;font-family:inherit;transition:.15s}.tabs button:hover{color:var(--c-text)}.tabs button.active{background:var(--c-elev);color:var(--c-text-strong);font-weight:600}

/* ---- 主题切换按钮 ---- */
.theme-btn{flex-shrink:0;margin-left:2px;background:transparent;border:1px solid var(--c-border);color:var(--c-dim);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:15px;line-height:1;font-family:inherit;transition:.15s;display:inline-flex;align-items:center;justify-content:center}
.theme-btn:hover{color:var(--c-text);border-color:var(--c-dim)}
.theme-btn:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}

/* ---- 面板 ---- */
.panels{flex:1;min-height:0;overflow:hidden}.panel{display:none;height:100%;overflow:auto}.panel.active{display:flex}.panel-inner{padding:26px 30px;width:100%}.placeholder{color:var(--c-faint);font-size:14px;line-height:2;max-width:640px}.placeholder h2{color:var(--c-text);font-size:20px;margin-bottom:12px}.placeholder code{background:var(--c-elev);padding:2px 8px;border-radius:5px;color:var(--c-accent);font-size:13px}#tab-paiban.active{display:flex;flex-direction:column}#guofeng-mount{flex:1;min-height:0}.panel-head{font-size:13px;color:var(--c-dim);margin-bottom:14px}.panel-head b{color:var(--c-accent)}@media (max-width:720px){.topbar{padding:10px 14px;gap:10px}.topbar .logo{font-size:15px}.topbar .logo small{display:block;margin:2px 0 0}.tabs{margin-left:0;width:100%;order:3;flex-wrap:nowrap}.tabs button{padding:11px 16px;font-size:13px;min-height:44px}.theme-btn{order:2;width:38px;height:38px}.panel-inner{padding:18px 16px}}

/* ---- 单实例工作台容器（纸面固定，不随外壳主题变） ---- */
.panel.wb-panel{overflow:hidden}.panel.wb-panel{position:relative}.panels{position:relative}
  .panel.wb-panel.active{display:flex;flex-direction:column}
  /* 单实例工作台：常驻 .panels 之上，四个主 Tab 共用；国风卡片 Tab 时隐藏 */
  .wb-holder{position:absolute;inset:0;display:none;flex-direction:column;z-index:5;background:var(--paper)}
  .wb-holder.visible{display:flex}
  .wb-holder .wb-frame{flex:1;width:100%;min-height:0;border:0;display:block;background:var(--paper)}
  .wb-holder .wb-loading{z-index:6}
  .wb-frame{background:var(--paper)}
.wb-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9a8f80;font-size:14px;letter-spacing:.1em;background:linear-gradient(100deg,#efe7d8 30%,#f7f1e6 50%,#efe7d8 70%);background-size:200% 100%;animation:wbSh 1.2s infinite}
.wb-holder.ready .wb-loading{display:none}
.wb-panel.ready .wb-loading{display:none}
@keyframes wbSh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .wb-frame{flex:1;width:100%;min-height:0;border:0;display:block;background:var(--paper)}.tabs button:focus-visible{outline:2px solid var(--c-accent);outline-offset:-2px}.wb-loading.timeout{animation:none;background:#f3ead9;color:#9A5B33}.wb-loading .retry{margin-left:12px;padding:7px 16px;border:1px solid #A8322A;border-radius:6px;background:#fff;color:#A8322A;font-family:inherit;font-size:13px;cursor:pointer}
</style>

         四个主 Tab 共用这一份实例，切 Tab 仅切换可见性 + postMessage 内层定位 -->

      <div class="wb-loading">加载国风排版工作台…</div>
    </div>
  </div>

  /* ============ 工具 ============ */
  function buildFontLink(theme) {
    const toks = Array.from(new Set(theme.fontTokens || []));
    if (!toks.length && theme.fonts && theme.fonts.base) toks.push(theme.fonts.base);
    const parts = toks.map(t => DATA.fontLink[t]).filter(Boolean);
    return FONT_BASE + parts.join('&family=');
  }
  function baseCSS(theme) {
    const c = theme.colors || {};
    const rootVars = Object.entries(c).map(([k, v]) => `${k.startsWith('--') ? k : '--' + k}:${v}`).join(';');
    const baseFamily = FAMILY[theme.fonts && theme.fonts.base] || FAMILY.serif;
    let css = `:root{${rootVars}}\n*{margin:0;padding:0;box-sizing:border-box}\n`;
    css += `body{display:flex;justify-content:center;background:${theme.bodyBg || '#e8e4dc'};padding:40px 16px;font-family:${baseFamily};text-rendering:optimizeLegibility;font-feature-settings:"kern" 1,"liga" 1}\n`;
    const d = theme.decor || {};
    if (d.paperTexture) css += `.card::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(180,170,150,.03) 2px,rgba(180,170,150,.03) 3px),repeating-linear-gradient(90deg,transparent,transparent 2px,rgba(180,170,150,.02) 2px,rgba(180,170,150,.02) 3px)}\n`;
    if (d.seal) css += `.seal{position:absolute;top:100px;right:80px;width:56px;height:56px;border:2px solid var(--accent-bright);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--accent-bright);font-size:22px;font-weight:700;writing-mode:vertical-rl;z-index:3;opacity:.7}\n`;
    if (d.frame) css += `.frame{position:absolute;inset:28px;border:1px solid var(--gold-line,var(--line));pointer-events:none}\n`;
    if (d.gradientText) css += `.decor-gradient .main-title,.decor-gradient .golden{background:linear-gradient(180deg,var(--gold-bright,var(--accent-bright)),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}\n`;
    return css;
  }

  /* ============ 纯函数 API ============ */
  function buildCard(styleKey, data, opts) {
    const theme = DATA.themes[styleKey];
    if (!theme) throw new Error('未知风格: ' + styleKey);
    opts = Object.assign({ ratio: '9:16', sign: SIGN_DEFAULT }, opts || {});
    const lay = LAYOUTS[theme.layout];
    if (!lay) throw new Error('未知布局: ' + theme.layout);
    const css = baseCSS(theme) + lay.css(theme, opts);
    const html = lay.html(theme, data || {}, opts);
    const link = buildFontLink(theme);
    return `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0"><title>${(data && data.title) || '卡片'} · ${theme.label}</title>
<link rel="stylesheet" href="${link}">
<style>${css}</style></head><body>${html}</body></html>`;
  }

  function resolveVarExpr(inner, vars) {
    const m = inner.match(/^--[\w-]+/);
    if (!m) return '';
    const name = m[0];
    if (vars[name]) return vars[name];
    const comma = inner.indexOf(',');
    if (comma >= 0) {
      let fb = inner.slice(comma + 1).trim();
      if (fb.startsWith('var(')) fb = resolveVarExpr(fb.slice(4, -1), vars);
      return fb;
    }
    return '';
  }
  /* 从最内层 var() 向外循环解析，正确处理 var(--a,var(--b)) 嵌套 fallback。
     旧实现用 /var\(([^)]*)\)/ 单次替换，遇嵌套时会把内层闭括号吞掉，
     导致 linear-gradient(...) 语法损坏 → background 失效 → 渐变文字（color:transparent）整段隐形。 */
  function resolveVars(str, vars) {
    let prev;
    do {
      prev = str;
      str = str.replace(/var\(([^()]*)\)/g, (_, inner) => {
        const ci = inner.indexOf(',');
        const name = (ci >= 0 ? inner.slice(0, ci) : inner).trim();
        const fb = ci >= 0 ? inner.slice(ci + 1).trim() : '';
        return vars[name] || fb;
      });
    } while (str !== prev);
    return str;
  }
  function inlineStyles(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const styleEls = Array.from(doc.querySelectorAll('style'));
    let css = styleEls.map(s => s.textContent).join('\n');
    const vars = {};
    const rootMatch = css.match(/:root\s*\{([^}]*)\}/);
    if (rootMatch) {
      rootMatch[1].split(';').forEach(decl => {
        const i = decl.indexOf(':');
        if (i > 0) { const k = decl.slice(0, i).trim(); const v = decl.slice(i + 1).trim(); if (k) vars[k] = v; }
      });
    }
    const rules = [];
    css.replace(/:root\s*\{[^}]*\}/, '').split('}').forEach(block => {
      const ci = block.indexOf('{');
      if (ci < 0) return;
      const sel = block.slice(0, ci).trim();
      const body = block.slice(ci + 1);
      if (!sel || sel.includes('::') || sel === '') return;
      const props = {};
      body.split(';').forEach(dl => {
        const i = dl.indexOf(':');
        if (i > 0) {
          const k = dl.slice(0, i).trim();
          let v = resolveVars(dl.slice(i + 1).trim(), vars);
          if (k) props[k] = v;
        }
      });
      if (Object.keys(props).length) rules.push({ sel, props });
    });
    /* 按 CSS 优先级（specificity）升序内联：高优先级规则后写入，正确覆盖低优先级。
     否则 `.decor-gradient .main-title`(0,2,0) 先写、`.main-title`(0,1,0) 后写会反向覆盖，
     导致渐变文字 color:transparent 被布局色覆盖 → 深色主题标题不可见。 */
  function specOf(sel) {
    const ids = (sel.match(/#[\w-]+/g) || []).length;
    const rest = sel.replace(/#[\w-]+/g, ' ');
    const cls = (rest.match(/\.[\w-]+/g) || []).length + (rest.match(/\[[^\]]*\]/g) || []).length;
    const rest2 = rest.replace(/\.[\w-]+/g, ' ').replace(/\[[^\]]*\]/g, ' ');
    const tags = (rest2.match(/(?:^|[\s>+~])[a-zA-Z][\w-]*/g) || []).length;
    return ids * 1000 + cls * 100 + tags;
  }
  rules.slice().sort((a, b) => specOf(a.sel) - specOf(b.sel)).forEach(({ sel, props }) => {
      let els = [];
      try { els = Array.from(doc.querySelectorAll(sel)); } catch (e) { return; }
      els.forEach(el => {
        const cur = el.getAttribute('style') || '';
        const add = Object.entries(props).map(([k, v]) => `${k}:${v}`).join(';');
        el.setAttribute('style', (cur ? cur + ';' : '') + add);
      });
    });
    styleEls.forEach(s => s.remove());
    Array.from(doc.querySelectorAll('[class]')).forEach(el => el.removeAttribute('class'));
    return '<!DOCTYPE html>' + doc.documentElement.outerHTML;
  }

  function validate(html, wechat) {
    const errs = [], warns = [];
    if (!wechat) {
      if (!html.toLowerCase().includes('<!doctype html>')) errs.push('缺少 <!DOCTYPE html>');
      if (!/静心知识库/.test(html)) errs.push('缺失统一落款');
      if (/ai生成|ai-generated|generated by ai/i.test(html)) errs.push('出现禁止的 AI 水印');
      if (!/line-height/.test(html)) warns.push('建议设置 line-height 垂直韵律');
      if (!/font-feature-settings|text-rendering/.test(html)) warns.push('建议设置文字渲染质感');
    } else {
      // 微信已发布文章支持 position:absolute（装饰层印章/水印/色块用），仅过滤真正会被剥离的写法
      const banned = {
        '<style': '禁止使用 <style>', 'class=': '禁止使用 class', 'display:grid': '禁用 grid',
        'position:fixed': '禁用 position:fixed（absolute 微信支持）',
        '@media': '禁用 @media', '@keyframes': '禁用 @keyframes', 'var(--': '禁用 CSS 变量', '<script': '禁用 script'
      };
      Object.entries(banned).forEach(([p, m]) => {
        const n = (html.match(new RegExp(p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi')) || []).length;
        if (n) errs.push(`${m}（${n} 次）`);
      });
      if (!/静心知识库/.test(html)) errs.push('缺失统一落款');
    }
    return { errs, warns };
  }

  function mount(container, options) {

    function sampleOf(key) { return DATA.themes[key].sample || {}; }

    function renderForm() {
      const form = $('.gc-form');
      form.innerHTML = '';

        const wrap = document.createElement('div'); wrap.className = 'gc-field';
        const lab = document.createElement('label'); lab.textContent = f.l; lab.setAttribute('for', 'f_' + f.k);

    /* —— 灵感库面板 —— */
    let appliedInsp = null; /* { el, btn, snap }：当前已应用的灵感（再点即还原配色） */
    function renderInsp(filter) {

      list.forEach(e => {

        const tags = (e.tags || []).map(t => `<span>${t}</span>`).join('');

  const WB_HTML = new TextDecoder("utf-8").decode(Uint8Array.from(atob(WB_B64), c => c.charCodeAt(0)));
  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  const THEME_KEY = 'gf_shell_theme';
  const THEMES = ['auto', 'light', 'dark'];
  const THEME_META = {
    auto:  { icon: '🌗', label: '外壳主题：跟随系统' },
    light: { icon: '☀️', label: '外壳主题：浅色（工作台不受影响）' },
    dark:  { icon: '🌙', label: '外壳主题：暗色' }
  };

  function applyTheme(mode) {
    const root = document.documentElement;
    if (mode === 'light' || mode === 'dark') root.setAttribute('data-theme', mode);
    else root.removeAttribute('data-theme');
    const btn = document.getElementById('themeBtn');
    if (btn) {
      const meta = THEME_META[mode] || THEME_META.auto;
      btn.textContent = meta.icon;
      btn.title = meta.label;
      btn.setAttribute('aria-label', meta.label);
      btn.dataset.mode = mode;
    }
  }

  function initTheme() {
    const saved = safeGet(THEME_KEY);
    applyTheme(THEMES.includes(saved) ? saved : 'auto');
    const btn = document.getElementById('themeBtn');
    if (!btn || btn.dataset.bound === '1') return;
    btn.dataset.bound = '1';
    btn.addEventListener('click', () => {
      const cur = btn.dataset.mode || 'auto';
      const next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
      safeSet(THEME_KEY, next);
      applyTheme(next);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initTheme);
  else initTheme();

  /* ===== 1) Tab 切换（ARIA + roving tabindex + 键盘可达） ===== */
  const tabs = document.querySelectorAll('#tabs button');
  const panels = document.querySelectorAll('.panel');

  function activateTab(btn, focus) {
    const t = btn.dataset.tab;
    tabs.forEach(b => {
      const on = b === btn;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
    });
    panels.forEach(p => p.classList.toggle('active', p.id === 'tab-' + t));
    // 切到新 Tab 后重算卡片预览缩放（引擎监听 window.resize 刷新预览）
    requestAnimationFrame(() => window.dispatchEvent(new Event('resize')));
    // 主 Tab（排版/配色/标题AB/看板）→ 显示单实例工作台并定位内层 Tab；国风卡片 → 隐藏
    if (WB_TABS[t]) showWb(t); else hideWb();
    if (focus) btn.focus();
  }

  tabs.forEach(btn => btn.addEventListener('click', () => activateTab(btn)));

  // 键盘可达性：左/右方向键、Home/End 在 Tab 间切换（roving tabindex）
  const tablist = document.getElementById('tabs');
  if (tablist) tablist.addEventListener('keydown', (e) => {
    if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].indexOf(e.key) < 0) return;
    const arr = Array.from(tabs);
    const cur = arr.indexOf(document.activeElement);
    if (cur < 0) return;
    e.preventDefault();
    let n = cur;
    if (e.key === 'ArrowRight') n = (cur + 1) % arr.length;
    if (e.key === 'ArrowLeft') n = (cur - 1 + arr.length) % arr.length;
    if (e.key === 'Home') n = 0;
    if (e.key === 'End') n = arr.length - 1;
    activateTab(arr[n], true);
  });

  /* ===== 2) 挂载国风卡片引擎（引擎缺失也不影响工作站外壳，故加 try/catch 兜底） ===== */
  try {
    // 独立「国风卡片」Tab；引擎也可能被其他场景再挂载，互不污染
    window.__gc2 = GuofengCard.mount('#guofeng-mount-2', { defaultStyle: 'swiss' });
  } catch (e) {
    console.warn('国风卡片引擎未加载，仅渲染工作站外壳：', e);
  }

  /* ===== 3) 单实例「国风排版工作台」：一份 iframe 服务四个主 Tab =====
     - iframe 常驻 .panels 容器（absolute 定位），移动 DOM 会导致 iframe 重载，因此永不挪动；

  const WB_TABS = { paiban: '1', peise: '2', biaoti: '3', kanban: '4', longform: '5', aipub: '6' };

  function switchInner(frame, n) {

  }

    const tip = document.querySelector("#wbHolder .wb-loading");
    let timer = null;
    const armTimeout = () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (frame.dataset.loaded === "1" || !tip || tip.querySelector(".retry")) return;

        if (btn) btn.addEventListener("click", () => {
          tip.classList.remove("timeout");
          tip.innerHTML = "加载国风排版工作台…";
          frame.dataset.loaded = "0";
          frame.srcdoc = WB_HTML.replace("<!-" + "-__DEF_TAB__-->", "<scr" + "ipt>try{var b=document.querySelector('.tabs button[data-tab=\"" + dt + "\"]');if(b)b.click();var s=document.createElement('style');s.textContent='.tabs{display:none!important}';document.head.appendChild(s);}catch(e){}</scr" + "ipt>");
          armTimeout();
        });
      }, WB_TIMEOUT);
    };
    armTimeout();
    if (frame.dataset.bound === "1") return;
    frame.dataset.bound = "1";
    frame.addEventListener("load", () => {
      clearTimeout(timer);
      frame.dataset.loaded = "1";
      try { frame.contentWindow.dispatchEvent(new Event("resize")); } catch (e) {}
      document.getElementById("wbHolder").classList.add("ready");
      // 胜出标题桥接：把 gf_ab_winner 派发给工作台（多实例时代遗留，现作幂等兜底）
      try {
        var w = safeGet("gf_ab_winner");
        if (w) frame.contentWindow.dispatchEvent(new StorageEvent("storage", { key: "gf_ab_winner", newValue: w }));
      } catch (e) {}
    });
  }

  function showWb(tabName) {
    const holder = document.getElementById("wbHolder");
    const frame = document.getElementById("wbFrame");
    holder.classList.add("visible");
    if (frame.dataset.ready === "1") switchInner(frame, WB_TABS[tabName]);
    else loadWb(frame, WB_TABS[tabName] || "1");
  }

  function hideWb() {
    document.getElementById("wbHolder").classList.remove("visible");
  }

  // 初始激活的 Tab（排版）立即加载单实例工作台
  showWb('paiban');
})();
</script>
</body>
</html>
