<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>公众号排版助手 · 多 Tab 工作站</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="workstation">
  <div class="topbar">
    <div class="logo">公众号排版助手 <small>多 Tab 工作站</small></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="工作站导航">
      <button role="tab" data-tab="paiban" class="active" aria-selected="true" aria-controls="tab-paiban" tabindex="0">排版</button>
      <button role="tab" data-tab="peise" aria-selected="false" aria-controls="tab-peise" tabindex="-1">配色</button>
      <button role="tab" data-tab="biaoti" aria-selected="false" aria-controls="tab-biaoti" tabindex="-1">标题生成与AB测试</button>
      <button role="tab" data-tab="kanban" aria-selected="false" aria-controls="tab-kanban" tabindex="-1">历史数据看板</button>
      <button role="tab" data-tab="guofeng" aria-selected="false" aria-controls="tab-guofeng" tabindex="-1">国风卡片</button>
    </div>
  </div>

  <div class="panels">
    <!-- 排版 / 配色 / 标题AB / 看板：单实例工作台的四个落点（内层 Tab 由 postMessage 切换） -->
    <section role="tabpanel" class="panel active wb-panel" id="tab-paiban"></section>
    <section role="tabpanel" class="panel wb-panel" id="tab-peise"></section>
    <section role="tabpanel" class="panel wb-panel" id="tab-biaoti"></section>
    <section role="tabpanel" class="panel wb-panel" id="tab-kanban"></section>
    <section role="tabpanel" class="panel" id="tab-guofeng"><div class="panel-inner" style="padding:0;height:100%;display:flex;flex-direction:column"><div id="guofeng-mount-2" style="flex:1;min-height:0"></div></div></section>

    <!-- 单实例工作台：iframe 常驻 .panels（absolute 定位，避免移动 DOM 触发重载），
         四个主 Tab 共用这一份实例，切 Tab 仅切换可见性 + postMessage 内层定位 -->
    <div class="wb-holder" id="wbHolder">
      <iframe class="wb-frame" id="wbFrame" sandbox="allow-scripts allow-same-origin allow-downloads" title="国风排版工作台"></iframe>
      <div class="wb-loading">加载国风排版工作台…</div>
    </div>
  </div>
  </div>

  <!-- 引擎（国风卡片）：先于外壳脚本声明，defer 保证按序执行 -->
  <script src="guofeng-card-engine.js" defer></script>
  <script src="main.js" defer></script>
</body>
</html>
